name: verbatim-recall
version: 0.4.3
description: "Turns compaction summaries into pointers. Indexes the summarized-away region of the current session AND, cross-session, the rest of the store into id-ranged chunks with keyword fingerprints, and injects a one-line 'this exists, here is the id span, read it verbatim' pointer when the current turn matches — naming the owning session when the span lives elsewhere. Silent otherwise."
author: Hermes Agent
license: MIT

provides_hooks:
  - pre_llm_call
  - post_compaction
  - post_tool_call

# Every knob of this plugin is a YAML item here and nowhere else. Values are written to
# config.yaml under plugins.entries.verbatim-recall.settings (a dotted key becomes a nested
# mapping) and are read back with ctx.get_config("<key>"). The module keeps the same
# defaults when it is imported outside Hermes (tests, CLI), so nothing depends on how it
# is loaded.
config_schema:
  db_path:
    type: str
    default: null
    label: State database
    description: "Path to the Hermes state.db to index. Empty = <HERMES_HOME>/state.db."

  # ---- current-session recall -------------------------------------------------
  quiet:
    type: bool
    default: false
    label: Quiet
    description: "Suppress the CLI's diagnostic lines."

  announce:
    type: bool
    default: true
    label: Announce the index
    description: "Say on the first turn how many summarized-away turns are searchable."

  top_k:
    type: int
    default: 2
    label: Spans per hit
    description: "How many adjacent id spans to offer for one matched turn."

  min_score:
    type: float
    default: 1.6
    label: Minimum score
    description: "Strict gate: idf-weighted score a turn must reach to be quoted."

  coverage:
    type: float
    default: 0.45
    label: Minimum coverage
    description: "Strict gate: fraction of the query's rare words that must appear in the turn."

  min_terms:
    type: int
    default: 2
    label: Minimum query terms
    description: "Distinct rare words a query needs before this plugin will look at all."

  loose_score:
    type: float
    default: 0.9
    label: Loose minimum score
    description: "Second pass, labelled LOW CONFIDENCE — a partial match, not a certainty."

  loose_coverage:
    type: float
    default: 0.20
    label: Loose minimum coverage
    description: "Second pass coverage floor; lower than the strict gate on purpose."

  loose_top_k:
    type: int
    default: 1
    label: Loose spans per hit
    description: "Spans offered by the low-confidence pass."

  common_weight:
    type: float
    default: 0.3
    label: Common-word weight
    description: "How much a query word that is common in the corpus still counts."

  span:
    type: int
    default: 24
    label: Span width
    description: "Messages on each side of a hit when reading a span back."

  preview:
    type: int
    default: 90
    label: Preview length
    description: "Characters of the matched turn shown in the pointer line."

  window:
    type: int
    default: 20
    label: Session-search window
    description: "Default window handed to session_search in the pointer."

  boiler_df:
    type: int
    default: 0
    label: Boilerplate threshold
    description: "A word in more than N messages is boilerplate and never a keyword. 0 = derive."

  rare_df:
    type: int
    default: 0
    label: Rare-word threshold
    description: "A word in at most N messages counts as rare. 0 = derive."

  # ---- cross-session recall ---------------------------------------------------
  cross_session.enabled:
    type: bool
    default: true
    label: Cross-session recall
    description: "Also surface spans from OTHER sessions on this store, as a foreign pointer."

  cross_session.top_k:
    type: int
    default: 2
    label: Cross-session spans
    description: "Foreign pointers offered per turn."

  cross_session.min_terms:
    type: int
    default: 3
    label: Cross-session min terms
    description: "Stricter than the local gate: distinct rare words a query needs."

  cross_session.share:
    type: float
    default: 0.55
    label: Cross-session coverage
    description: "Fraction of the query's rare words a foreign span must contain."

  cross_session.pool:
    type: int
    default: 200
    label: Candidate pool
    description: "Foreign turns fetched per query before scoring. 200 halves the candidates of 400 and is cheaper; on an 18-query replay it returned 15 pointers against main's 14, with one hit known to exist only past rank 200. Larger is not more accurate here, only slower."

  cross_session.df_probe:
    type: int
    default: 12
    label: DF probe terms
    description: "How many query words get their store-wide frequency probed before the MATCH is chosen. The count is bounded at df_cap+1 rows, so a ubiquitous word costs ~0.7 ms instead of 14.6 ms (a prefix-heavy term ~6.5 ms). Default covers the full max_terms vocabulary so a rare anchor late in a long query is not dropped."

  cross_session.df_cap:
    type: int
    default: 5000
    label: Common-term cap
    description: "A query word occurring in more rows than this cannot anchor the candidate MATCH — one ubiquitous word ('ubuntu' = 48,376 rows on a large store) is what made the cross-session pass expensive. Excluded words still score; they just no longer fetch."

  cross_session.max_terms:
    type: int
    default: 12
    label: Max query terms
    description: "Maximum query words used for the foreign fingerprint match."

  cross_session.cooldown:
    type: int
    default: 6
    label: Cooldown turns
    description: "Turns to wait before repeating the same foreign pointer."

  cross_session.sources:
    type: list
    default: ["telegram", "api_server", "cli", "desktop", "mobile", "a2a"]
    label: Sources
    description: "Session sources eligible for foreign pointers. cron/oneshot are excluded."

  cross_session.same_user_only:
    type: bool
    default: true
    label: Same operator only
    description: "Only quote foreign rows whose principal is the caller, was never recorded, or is declared trusted below."

  cross_session.trusted_principals:
    type: list
    default: ["api"]
    label: Trusted principals
    description: "Extra principals treated as this operator: 'api' is the local api_server surface."

  cross_session.trusted_sources:
    type: list
    default: ["a2a"]
    label: Trusted sources
    description: "Sources quoted whatever the principal — another machine of the same operator."

  cross_session.unattributed_sources:
    type: list
    default: ["cli", "api_server"]
    label: Sources that may ask anonymously
    description: "Surfaces that run as this operator but record no user_id. They see unrecorded rows; every other anonymous asker sees only its own."

  metrics.enabled:
    type: bool
    default: true
    label: Record metrics
    description: "Write one local JSON line per turn: what was injected, and what the reader then read back."

  metrics.path:
    type: str
    default: ""
    label: Metrics directory
    description: "Where the day files go. Empty = <hermes home>/logs/verbatim-recall."

  metrics.retention_days:
    type: int
    default: 30
    label: Retention (days)
    description: "Day files older than this are deleted on the next write."

  metrics.store_terms:
    type: bool
    default: true
    label: Store matched terms
    description: "Keep the query words that matched, so false positives can be diagnosed. Message bodies are never stored."

  metrics.shadow_knobs:
    type: bool
    default: true
    label: Record rejected candidates
    description: "Log what the gates threw away and how close it scored — the false-negative watch."

  metrics.tag:
    type: str
    default: ""
    label: Event source tag
    description: "Written as src on every event. The suite sets test; vr_replay sets replay. Leave empty for live traffic."
